name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  # ──────────────────────────────────────────────
  # Build standalone executables on each platform
  # ──────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive_cmd: "tar -czf ../TimeTracker-linux.tar.gz TimeTracker"
            archive_ext: "tar.gz"
          - os: macos-latest
            platform: macos
            archive_cmd: "tar -czf ../TimeTracker-macos.tar.gz TimeTracker"
            archive_ext: "tar.gz"
          - os: windows-latest
            platform: windows
            archive_cmd: "Compress-Archive -Path TimeTracker.exe -DestinationPath ../TimeTracker-windows.zip"
            archive_ext: "zip"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Linux: install Qt/OpenGL system libraries ──
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libegl1 \
            libxkbcommon0 \
            libdbus-1-3 \
            libxcb-xinerama0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-keysyms1 \
            libxcb-shape0

      # ── Install Python packages ──
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # ── Build with PyInstaller ──
      - name: Build executable
        run: |
          pyinstaller \
            --onefile \
            --windowed \
            --name TimeTracker \
            --clean \
            --noconfirm \
            --add-data "config.json:." \
            main.py
        shell: bash

      # ── Package: Unix (tar.gz) ──
      - name: Package artifact (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cd dist
          chmod +x TimeTracker
          ${{ matrix.archive_cmd }}

      # ── Package: Windows (zip) ──
      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd dist
          ${{ matrix.archive_cmd }}

      # ── Upload build artifact ──
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeTracker-${{ matrix.platform }}
          path: TimeTracker-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # Create a GitHub Release with all platform builds
  # ──────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -R artifacts

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Time Tracker ${{ steps.tag.outputs.tag }}"
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            artifacts/TimeTracker-linux.tar.gz
            artifacts/TimeTracker-macos.tar.gz
            artifacts/TimeTracker-windows.zip
